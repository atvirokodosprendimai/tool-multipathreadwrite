name: brew-tap

# ADR-172: downstream of release CI. workflow_run filters the triggering run's
# branch, so a main-only filter would exclude every version tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Latest stable tag to publish or repair (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tap:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Publish and verify the release formula
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            args=(--tag "$TAG")
          else
            args=(--run-id "$RUN_ID")
          fi
          python3 scripts/brew_tap.py "${args[@]}"
