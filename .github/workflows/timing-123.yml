name: timing-123

# ADR-123 T1 S3 (Zy, 2026-10-03: "CI runner timing"): --grep over a 3,000-file
# tree on Windows, with v1.46.0 (before ADR-123) and v1.47.0 (after), straight
# and through a junction root. Run by hand; it gates nothing.
on:
  workflow_dispatch:
  push:
    branches: [adr-123-s3-timing]

permissions:
  contents: read

jobs:
  timing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build v1.46.0 and v1.47.0, time --grep
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          T=$(cygpath -m "$RUNNER_TEMP")
          for v in v1.46.0 v1.47.0; do
            git worktree add -q "$T/src-$v" "$v"
            (cd "$T/src-$v" && CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$v" -o "$T/mrw-$v.exe" ./cmd/mrw)
            "$T/mrw-$v.exe" version
          done
          mkdir -p "$T/tree"
          for d in $(seq -w 0 29); do
            mkdir -p "$T/tree/d$d/sub"
            for f in $(seq -w 0 49); do
              printf 'line one\nline two\nnot here\n' > "$T/tree/d$d/f$f.txt"
              printf 'deeper\nnothing\n' > "$T/tree/d$d/sub/g$f.txt"
            done
          done
          printf 'a needle here\n' > "$T/tree/d07/sub/g13.txt"
          printf 'another needle\n' > "$T/tree/d21/f42.txt"
          echo "files: $(find "$T/tree" -type f | wc -l)"
          cmd /c mklink /J "$(cygpath -w "$T/jroot")" "$(cygpath -w "$T/tree")"
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_OperatingSystem).Caption"
          ms() { local s e; s=$(date +%s%N); "$@" > /dev/null; e=$(date +%s%N); echo $(( (e - s) / 1000000 )); }
          for root in tree jroot; do
            for v in v1.46.0 v1.47.0; do
              out=$("$T/mrw-$v.exe" --root "$T/$root" read --grep needle)
              served=$(printf '%s\n' "$out" | grep -c '^==> ')
              "$T/mrw-$v.exe" --root "$T/$root" read --grep needle > /dev/null   # warm
              runs=""
              for i in 1 2 3 4 5; do runs="$runs $(ms "$T/mrw-$v.exe" --root "$T/$root" read --grep needle)"; done
              med=$(printf '%s\n' $runs | sort -n | sed -n 3p)
              echo "RESULT root=$root version=$v served=$served runs_ms=[$runs ] median_ms=$med per_file_us=$(( med * 1000 / 3000 ))"
            done
          done
