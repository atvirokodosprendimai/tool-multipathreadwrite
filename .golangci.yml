# golangci-lint configuration (ADR-088). scripts/static.sh runs it with the
# other analysers; CI runs that script. Every exclusion below names why.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused), linters
  # that find defects, and the checks that enforce the comment rules
  # CONTRIBUTING.md states (staticcheck ST1000, ST1020-ST1022; revive exported).
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    staticcheck:
      # QF* are refactoring suggestions, not defects. ST1000 (a package comment,
      # except in package main) and ST1020-ST1022 (a doc comment that exists starts
      # with the name) enforce what CONTRIBUTING.md asks for; two doc comments
      # were found orphaned above another declaration when they were first
      # enabled. ST1003 and ST1016 (identifier spelling, receiver names) are
      # style this repository does not state.
      checks: ["all", "-QF*", "-ST1003", "-ST1016"]
    revive:
      # Only `exported`, as its explicit rules list replaces revive's defaults:
      # the doc comment an exported type, function, method, variable or constant
      # is missing, and a name that stutters with its package. It skips struct
      # fields and interface methods; staticcheck's ST1020-ST1022 judge the form
      # of a comment that exists.
      rules:
        - name: exported
    errcheck:
      # A formatted write goes to a buffered writer whose error reaches a
      # checked Flush (ADR-088 T4), to an in-memory buffer that cannot fail, or
      # to stderr, where a failure has nowhere to be reported. Every other
      # discarded error is written `_ =` at its site.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # A test helper takes fixed arguments by design, a test asserts on the
      # error exec or os returned directly, which is never wrapped, and a test's
      # cleanup or environment setup cannot change its verdict.
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
          - unparam
      # A test helper that returns (error, output) reads in call order; the
      # convention is for APIs, and changing it rewrites locked test bodies.
      - path: _test\.go
        linters:
          - staticcheck
        text: "ST1008"

issues:
  # Every finding, every time: the default caps (50 per linter, 3 of a kind)
  # hid real findings behind the first three of a kind.
  max-issues-per-linter: 0
  max-same-issues: 0
